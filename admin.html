                                    <th class="px-5 py-3">Status</th>
                                    <th class="px-5 py-3 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="adminUsersTable" class="divide-y divide-slate-100">
                                <tr><td colspan="6" class="text-center py-8 text-slate-400">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            await fetchAdminUsers();
        }

        async function fetchAdminUsers() {
            try {
                const { data, error } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(200);

                if (error) throw error;
                allAdminUsers = data || [];
                renderAdminUsers();
            } catch (err) {
                showAdminToast('Failed to load users', 'error');
            }
        }

        function renderAdminUsers() {
            const tbody = document.getElementById('adminUsersTable');
            if (!tbody) return;

            const search = (document.getElementById('userSearchInput')?.value || '').toLowerCase();
            const filtered = allAdminUsers.filter(u => 
                (u.full_name || '').toLowerCase().includes(search) || 
                (u.id || '').toLowerCase().includes(search)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-8 text-slate-400">No users found.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(u => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-5 py-3">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">${(u.full_name || 'U')[0].toUpperCase()}</div>
                            <div>
                                <p class="text-xs font-bold text-slate-800">${u.full_name || 'Unknown'}</p>
                                <p class="text-[10px] text-slate-500">${u.phone || 'No phone'}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-5 py-3">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase ${u.role === 'super_admin' || u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'seller' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'}">${u.role}</span>
                    </td>
                    <td class="px-5 py-3">
                        <span class="text-[10px] font-bold uppercase ${u.kyc_status === 'approved' ? 'text-emerald-600' : u.kyc_status === 'pending' ? 'text-amber-600' : 'text-slate-400'}">${u.kyc_status || 'not_submitted'}</span>
                    </td>
                    <td class="px-5 py-3 text-[10px] text-slate-500">${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="px-5 py-3">
                        ${u.is_banned 
                            ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-red-100 text-red-700 uppercase">Banned</span>` 
                            : `<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-700 uppercase">Active</span>`}
                    </td>
                    <td class="px-5 py-3 text-right space-x-2">
                        <button onclick="viewUserDetails('${u.id}')" class="text-xs font-bold text-blue-600 hover:underline">View</button>
                        ${u.is_banned 
                            ? `<button onclick="unbanUser('${u.id}')" class="text-xs font-bold text-emerald-600 hover:underline">Unban</button>` 
                            : `<button onclick="openBanModal('${u.id}')" class="text-xs font-bold text-red-500 hover:underline">Ban</button>`}
                    </td>
                </tr>
            `).join('');
        }

        function filterAdminUsers() {
            renderAdminUsers();
        }

        function viewUserDetails(userId) {
            const u = allAdminUsers.find(x => x.id === userId);
            if (!u) return;

            const modalHtml = `
                <div id="adminUserModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3 fade-in">
                    <div class="bg-white rounded-2xl max-w-md w-full max-h-[90vh] overflow-y-auto p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-lg">User Details</h3>
                            <button onclick="document.getElementById('adminUserModal').remove()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-3 text-sm">
                            <p><b>Name:</b> ${u.full_name || 'Unknown'}</p>
                            <p><b>Phone:</b> ${u.phone || 'N/A'}</p>
                            <p><b>Role:</b> <span class="uppercase font-bold">${u.role}</span></p>
                            <p><b>KYC Status:</b> <span class="uppercase font-bold">${u.kyc_status || 'not_submitted'}</span></p>
                            <p><b>Banned:</b> ${u.is_banned ? 'Yes' : 'No'}</p>
                            ${u.banned_reason ? `<p><b>Ban Reason:</b> ${u.banned_reason}</p>` : ''}
                            <p><b>Joined:</b> ${new Date(u.created_at).toLocaleString()}</p>
                            <p><b>Last Login:</b> ${u.last_login_at ? new Date(u.last_login_at).toLocaleString() : 'Never'}</p>
                            <p><b>IP Address:</b> ${u.last_ip || 'N/A'}</p>
                            <p><b>Device:</b> ${u.last_device || 'N/A'}</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('adminUserModal').classList.remove('hidden');
        }

        // ==========================================
        // BAN / UNBAN LOGIC
        // ==========================================
        function openBanModal(userId) {
            const modalHtml = `
                <div id="adminBanModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3 fade-in">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-lg text-red-600">Ban User</h3>
                            <button onclick="document.getElementById('adminBanModal').remove()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-500">Ban Type</label>
                                <select id="banTypeSelect" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-red-500">
                                    <option value="temporary">Temporary</option>
                                    <option value="permanent">Permanent</option>
                                </select>
                            </div>
                            <div id="banDurationBox">
                                <label class="text-xs font-bold text-slate-500">Duration (Days)</label>
                                <input id="banDurationDays" type="number" value="7" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500">Reason *</label>
                                <textarea id="banReasonInput" rows="2" required placeholder="Explain the reason for ban..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-red-500"></textarea>
                            </div>
                            <button onclick="confirmBanUser('${userId}')" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm mt-2 transition">Confirm Ban</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('adminBanModal').classList.remove('hidden');
        }

        async function confirmBanUser(userId) {
            const banType = document.getElementById('banTypeSelect').value;
            const duration = document.getElementById('banDurationDays')?.value;
            const reason = document.getElementById('banReasonInput').value.trim();
            const user = allAdminUsers.find(x => x.id === userId);

            if (!reason) { showAdminToast('Please enter a reason', 'error'); return; }

            try {
                await supabaseClient.from('profiles').update({
                    is_banned: true,
                    banned_reason: reason,
                    banned_at: new Date().toISOString(),
                    banned_by: currentAdmin.id
                }).eq('id', userId);

                await supabaseClient.from('ban_history').insert({
                    user_id: userId,
                    user_email: user?.email || null,
                    ban_type: banType,
                    ban_duration_days: banType === 'temporary' ? parseInt(duration) || 7 : null,
                    reason: reason,
                    phone: user?.phone || null,
                    ip_address: user?.last_ip || null,
                    device_fingerprint: user?.last_device || null,
                    banned_by: currentAdmin.id
                });

                if (banType === 'permanent') {
                    if (user?.phone) {
                        await supabaseClient.from('banned_phones').upsert({ phone: user.phone, reason, banned_by: currentAdmin.id, original_user_id: userId }, { onConflict: 'phone' });
                    }
                    if (user?.last_ip) {
                        await supabaseClient.from('banned_ips').upsert({ ip_address: user.last_ip, reason, banned_by: currentAdmin.id, original_user_id: userId }, { onConflict: 'ip_address' });
                    }
                    if (user?.last_device) {
                        await supabaseClient.from('banned_devices').upsert({ fingerprint: user.last_device, reason, banned_by: currentAdmin.id, original_user_id: userId }, { onConflict: 'fingerprint' });
                    }
                }

                try {
                    await supabaseClient.from('notifications').insert({
                        user_id: userId,
                        title: 'Account Suspended',
                        message: `Your account has been ${banType === 'temporary' ? 'temporarily' : 'permanently'} banned. Reason: ${reason}`,
                        type: 'error'
                    });
                } catch(e) {}

                showAdminToast('User banned successfully!');
                document.getElementById('adminBanModal').remove();
                await fetchAdminUsers();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        async function unbanUser(userId) {
            if (!confirm('Are you sure you want to unban this user?')) return;
            try {
                await supabaseClient.from('profiles').update({
                    is_banned: false,
                    banned_reason: null,
                    banned_at: null,
                    banned_by: null
                }).eq('id', userId);

                try {
                    await supabaseClient.from('notifications').insert({
                        user_id: userId,
                        title: 'Account Restored',
                        message: 'Your account has been restored. Welcome back!',
                        type: 'success'
                    });
                } catch(e) {}

                showAdminToast('User unbanned successfully!');
                await fetchAdminUsers();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        // ==========================================
        // GLOBAL EXPORTS
        // ==========================================
        window.loadAdminUsers = loadAdminUsers;
        window.filterAdminUsers = filterAdminUsers;
        window.viewUserDetails = viewUserDetails;
        window.openBanModal = openBanModal;
        window.confirmBanUser = confirmBanUser;
        window.unbanUser = unbanUser;
      </script>

      <script>
        // ==========================================
        // SELLERS MANAGEMENT LOGIC
        // ==========================================
        let allSellerApplications = [];

        async function loadAdminSellers() {
            const pageBox = document.getElementById('page-sellers');
            pageBox.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-black text-slate-800">Seller Applications</h3>
                        <button onclick="loadAdminSellers()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold transition">
                            <i class="fa-solid fa-rotate-right"></i> Refresh
                        </button>
                    </div>
                    <div id="sellerAppsList" class="p-5">
                        <p class="text-center text-slate-400 py-8">Loading...</p>
                    </div>
                </div>
            `;
            await fetchSellerApplications();
        }

        async function fetchSellerApplications() {
            try {
                const { data, error } = await supabaseClient
                    .from('seller_applications')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allSellerApplications = data || [];
                renderSellerApplications();
            } catch (err) {
                showAdminToast('Failed to load applications', 'error');
            }
        }

        function renderSellerApplications() {
            const box = document.getElementById('sellerAppsList');
            if (!box) return;

            if (allSellerApplications.length === 0) {
                box.innerHTML = '<p class="text-center text-slate-400 py-8">No applications yet.</p>';
                return;
            }

            box.innerHTML = allSellerApplications.map(app => `
                <div class="border border-slate-200 rounded-xl p-4 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-sm font-bold text-slate-800">${app.shop_name}</p>
                            <p class="text-[10px] text-slate-500">${app.full_name} · ${app.phone}</p>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${app.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : app.status === 'rejected' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'} uppercase">${app.status}</span>
                    </div>
                    <p class="text-xs text-slate-600 mb-2">${app.shop_description || 'No description'}</p>
                    <div class="flex gap-2 text-[10px] text-slate-500 mb-3">
                        <span><b>Type:</b> ${app.business_type || 'N/A'}</span>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-3">
                        ${app.nid_front_url ? `<a href="${app.nid_front_url}" target="_blank" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold">NID Front</a>` : ''}
                        ${app.nid_back_url ? `<a href="${app.nid_back_url}" target="_blank" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold">NID Back</a>` : ''}
                        ${app.selfie_with_nid_url ? `<a href="${app.selfie_with_nid_url}" target="_blank" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold">Selfie</a>` : ''}
                        ${app.business_proof_url ? `<a href="${app.business_proof_url}" target="_blank" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded font-bold">Business Proof</a>` : ''}
                    </div>
                    ${app.status === 'pending' ? `
                        <div class="flex gap-2">
                            <button onclick="approveSellerApp('${app.id}', '${app.user_id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-xl transition">Approve</button>
                            <button onclick="rejectSellerApp('${app.id}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 rounded-xl transition">Reject</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        async function approveSellerApp(appId, userId) {
            try {
                await supabaseClient.from('seller_applications').update({
                    status: 'approved',
                    reviewed_by: currentAdmin.id,
                    reviewed_at: new Date().toISOString()
                }).eq('id', appId);

                await supabaseClient.from('profiles').update({ role: 'seller', kyc_status: 'approved' }).eq('id', userId);

                try {
                    await supabaseClient.from('notifications').insert({
                        user_id: userId,
                        title: 'Seller Application Approved',
                        message: 'Congratulations! Your seller application has been approved. You can now start selling.',
                        type: 'success'
                    });
                } catch(e) {}

                showAdminToast('Seller approved!');
                await fetchSellerApplications();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        async function rejectSellerApp(appId) {
            const reason = prompt('Rejection reason:');
            if (!reason) return;
            try {
                await supabaseClient.from('seller_applications').update({
                    status: 'rejected',
                    admin_notes: reason,
                    reviewed_by: currentAdmin.id,
                    reviewed_at: new Date().toISOString()
                }).eq('id', appId);
                showAdminToast('Application rejected.');
                await fetchSellerApplications();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        // ==========================================
        // GLOBAL EXPORTS
        // ==========================================
        window.loadAdminSellers = loadAdminSellers;
        window.approveSellerApp = approveSellerApp;
        window.rejectSellerApp = rejectSellerApp;
      </script>

      <script>
        // ==========================================
        // REPORTS MANAGEMENT LOGIC
        // ==========================================
        let allAdminReports = [];

        async function loadAdminReports() {
            const pageBox = document.getElementById('page-reports');
            pageBox.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-black text-slate-800">Reports & Disputes</h3>
                        <button onclick="loadAdminReports()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold transition">
                            <i class="fa-solid fa-rotate-right"></i> Refresh
                        </button>
                    </div>
                    <div id="adminReportsList" class="p-5">
                        <p class="text-center text-slate-400 py-8">Loading...</p>
                    </div>
                </div>
            `;
            await fetchAdminReports();
        }

        async function fetchAdminReports() {
            try {
                const { data, error } = await supabaseClient
                    .from('reports')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allAdminReports = data || [];
                renderAdminReports();
            } catch (err) {
                showAdminToast('Failed to load reports', 'error');
            }
        }

        function renderAdminReports() {
            const box = document.getElementById('adminReportsList');
            if (!box) return;

            if (allAdminReports.length === 0) {
                box.innerHTML = '<p class="text-center text-slate-400 py-8">No reports found.</p>';
                return;
            }

            box.innerHTML = allAdminReports.map(r => `
                <div class="border border-slate-200 rounded-xl p-4 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-sm font-bold text-slate-800">${r.report_type.replace(/_/g, ' ').toUpperCase()}</p>
                            <p class="text-[10px] text-slate-500">Reported by: ${r.reporter_role} | Reported User: ${r.reported_role}</p>
                        </div>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${r.status === 'resolved' ? 'bg-emerald-100 text-emerald-700' : r.status === 'dismissed' ? 'bg-slate-100 text-slate-500' : 'bg-amber-100 text-amber-700'} uppercase">${r.status}</span>
                    </div>
                    <p class="text-xs text-slate-600 mb-2">${r.description}</p>
                    ${r.evidence_url ? `<a href="${r.evidence_url}" target="_blank" class="text-[10px] text-blue-600 font-bold hover:underline">View Evidence</a>` : ''}
                    
                    ${r.status === 'pending' ? `
                        <div class="flex gap-2 mt-3">
                            <button onclick="openResolveReportModal('${r.id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2 rounded-xl transition">Resolve</button>
                            <button onclick="dismissReport('${r.id}')" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold py-2 rounded-xl transition">Dismiss</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function openResolveReportModal(reportId) {
            const modalHtml = `
                <div id="resolveReportModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3 fade-in">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-lg">Resolve Report</h3>
                            <button onclick="document.getElementById('resolveReportModal').remove()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-500">Admin Notes</label>
                                <textarea id="resolveReportNotes" rows="3" placeholder="Add notes about the resolution..." class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                            </div>
                            <button onclick="confirmResolveReport('${reportId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm mt-2 transition">Confirm Resolution</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('resolveReportModal').classList.remove('hidden');
        }

        async function confirmResolveReport(reportId) {
            const notes = document.getElementById('resolveReportNotes').value.trim();
            try {
                await supabaseClient.from('reports').update({
                    status: 'resolved',
                    admin_notes: notes || null,
                    resolved_by: currentAdmin.id,
                    resolved_at: new Date().toISOString(),
                    action_taken: 'resolved'
                }).eq('id', reportId);

                showAdminToast('Report resolved!');
                document.getElementById('resolveReportModal').remove();
                await fetchAdminReports();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        async function dismissReport(reportId) {
            if (!confirm('Dismiss this report?')) return;
            try {
                await supabaseClient.from('reports').update({
                    status: 'dismissed',
                    resolved_by: currentAdmin.id,
                    resolved_at: new Date().toISOString(),
                    action_taken: 'dismissed'
                }).eq('id', reportId);
                showAdminToast('Report dismissed.');
                await fetchAdminReports();
            } catch (err) {
                showAdminToast(err.message, 'error');
            }
        }

        // ==========================================
        // RULES & POLICIES MANAGEMENT
        // ==========================================
        let allAdminRules = [];

        async function loadAdminRules() {
            const pageBox = document.getElementById('page-rules');
            pageBox.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                        <h3 class="font-black text-slate-800">Rules & Policies</h3>
                        <div class="flex gap-2">
                            <button onclick="openRuleForm()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold transition"><i class="fa-solid fa-plus"></i> Add Rule</button>
                            <button onclick="loadAdminRules()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl font-bold transition"><i class="fa-solid fa-rotate-right"></i></button>
                        </div>
                    </div>
                    <div id="adminRulesList" class="p-5">
                        <p class="text-center text-slate-400 py-8">Loading...</p>
                    </div>
                </div>
            `;
            await fetchAdminRules();
        }

        async function fetchAdminRules() {
            try {
                const { data, error } = await supabaseClient.from('rules').select('*').order('sort_order');
                if (error) throw error;
                allAdminRules = data || [];
                renderAdminRules();
            } catch (err) { showAdminToast('Failed to load rules', 'error'); }
        }

        function renderAdminRules() {
            const box = document.getElementById('adminRulesList');
            if (!box) return;

            if (allAdminRules.length === 0) {
                box.innerHTML = '<p class="text-center text-slate-400 py-8">No rules added yet.</p>';
                return;
            }

            box.innerHTML = allAdminRules.map(r => `
                <div class="border border-slate-200 rounded-xl p-4 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-sm font-bold text-slate-800">${r.title}</p>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${r.audience === 'customer' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'} uppercase">${r.audience}</span>
                        </div>
                        <span class="text-[10px] font-bold ${r.is_active ? 'text-emerald-600' : 'text-slate-400'}">${r.is_active ? 'Active' : 'Hidden'}</span>
                    </div>
                    <p class="text-xs text-slate-600 mb-3">${r.content}</p>
                    <div class="flex gap-2">
                        <button onclick="openRuleForm('${r.id}')" class="text-xs font-bold text-blue-600 hover:underline">Edit</button>
                        <button onclick="deleteAdminRule('${r.id}')" class="text-xs font-bold text-red-500 hover:underline">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function openRuleForm(ruleId = null) {
            const r = ruleId ? allAdminRules.find(x => x.id === ruleId) : null;
            const modalHtml = `
                <div id="adminRuleModal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-3 fade-in">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-lg">${r ? 'Edit Rule' : 'Add New Rule'}</h3>
                            <button onclick="document.getElementById('adminRuleModal').remove()" class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <form onsubmit="saveAdminRule(event, '${ruleId || ''}')" class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-slate-500">Audience</label>
                                <select id="ruleAudience" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
                                    <option value="customer" ${r?.audience === 'customer' ? 'selected' : ''}>Customer</option>
                                    <option value="seller" ${r?.audience === 'seller' ? 'selected' : ''}>Seller</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500">Title *</label>
                                <input id="ruleTitle" required value="${r?.title || ''}" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500">Content *</label>
                                <textarea id="ruleContent" rows="4" required class="w-full border border-slate-300 rounded-xl px-3 py-2 text-sm mt-1 outline-none focus:ring-2 focus:ring-blue-500">${r?.content || ''}</textarea>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="checkbox" id="ruleActive" ${r?.is_active !== false ? 'checked' : ''} class="w-4 h-4 text-blue-600 rounded">
                                <label for="ruleActive" class="text-xs font-bold text-slate-600">Active / Visible</label>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm mt-4 transition">${r ? 'Update Rule' : 'Create Rule'}</button>
                        </form>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            document.getElementById('adminRuleModal').classList.remove('hidden');
        }

        async function saveAdminRule(event, ruleId) {
            event.preventDefault();
            const data = {
                audience: document.getElementById('ruleAudience').value,
                title: document.getElementById('ruleTitle').value.trim(),
                content: document.getElementById('ruleContent').value.trim(),
                is_active: document.getElementById('ruleActive').checked
            };
            try {
                if (ruleId) {
                    await supabaseClient.from('rules').update(data).eq('id', ruleId);
                    showAdminToast('Rule updated!');
                } else {
                    await supabaseClient.from('rules').insert(data);
                    showAdminToast('Rule created!');
                }
                document.getElementById('adminRuleModal').remove();
                await fetchAdminRules();
            } catch (err) { showAdminToast(err.message, 'error'); }
        }

        async function deleteAdminRule(ruleId) {
            if (!confirm('Delete this rule?')) return;
            try {
                await supabaseClient.from('rules').delete().eq('id', ruleId);
                showAdminToast('Rule deleted!');
                await fetchAdminRules();
            } catch (err) { showAdminToast(err.message, 'error'); }
        }

        // ==========================================
        // GLOBAL EXPORTS
        // ==========================================
        window.loadAdminReports = loadAdminReports;
        window.openResolveReportModal = openResolveReportModal;
        window.confirmResolveReport = confirmResolveReport;
        window.dismissReport = dismissReport;
        window.loadAdminRules = loadAdminRules;
        window.openRuleForm = openRuleForm;
        window.saveAdminRule = saveAdminRule;
        window.deleteAdminRule = deleteAdminRule;
      </script>
  
     <script>
        // ==========================================
        // SITE SETTINGS MANAGEMENT
        // ==========================================
        let allAdminSettings = [];

        async function loadAdminSettings() {
            const pageBox = document.getElementById('page-settings');
            pageBox.innerHTML = `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-200">
                        <h3 class="font-black text-slate-800">Site Settings</h3>
                    </div>
                    <div id="adminSettingsList" class="p-5">
                        <p class="text-center text-slate-400 py-8">Loading...</p>
                    </div>
                </div>
            `;
            await fetchAdminSettings();
        }

        async function fetchAdminSettings() {
            try {
                const { data, error } = await supabaseClient.from('site_settings').select('*').order('key');
                if (error) throw error;
                allAdminSettings = data || [];
                renderAdminSettings();
            } catch (err) { showAdminToast('Failed to load settings', 'error'); }
        }

        function renderAdminSettings() {
            const box = document.getElementById('adminSettingsList');
            if (!box) return;

            if (allAdminSettings.length === 0) {
                box.innerHTML = '<p class="text-center text-slate-400 py-8">No settings found.</p>';
                return;
            }

            box.innerHTML = allAdminSettings.map(s => `
                <div class="flex items-center gap-3 border-b border-slate-100 py-3 last:border-0">
                    <div class="flex-1">
                        <p class="text-xs font-bold text-slate-700">${s.key.replace(/_/g, ' ').toUpperCase()}</p>
                        <input id="setting_${s.key}" value="${s.value || ''}" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs mt-1 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="saveAdminSetting('${s.key}')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition mt-4">Save</button>
                </div>
            `).join('');
        }

        async function saveAdminSetting(key) {
            const val = document.getElementById(`setting_${key}`).value.trim();
            try {
                await supabaseClient.from('site_settings').update({ value: val, updated_at: new Date().toISOString() }).eq('key', key);
                showAdminToast('Setting saved!');
            } catch (err) { showAdminToast(err.message, 'error'); }
        }

        // ==========================================
        // LIVE MONITORING PAGE INITIALIZATION
        // ==========================================
        function initMonitoringPage() {
            if (typeof window.zInjectMonitoringUI === 'function') {
                window.zInjectMonitoringUI();
            }
            if (typeof window.zLoadMonitoring === 'function') {
                window.zLoadMonitoring();
            }
        }

        // ==========================================
        // FINAL ADMIN PAGE INITIALIZATION & ROUTING
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const originalShowAdminPage = window.showAdminPage;
            
            // Override page routing to load data specific to each admin page
            window.showAdminPage = function(pageId) {
                originalShowAdminPage(pageId);
                if (pageId === 'monitoring') initMonitoringPage();
                if (pageId === 'reports') loadAdminReports();
                if (pageId === 'rules') loadAdminRules();
                if (pageId === 'settings') loadAdminSettings();
                if (pageId === 'users') loadAdminUsers();
                if (pageId === 'sellers') loadAdminSellers();
                if (pageId === 'products') loadAdminProducts();
                if (pageId === 'orders') loadAdminOrders();
            };
        });

        // ==========================================
        // GLOBAL EXPORTS
        // ==========================================
        window.loadAdminSettings = loadAdminSettings;
        window.saveAdminSetting = saveAdminSetting;
    </script>
</body>
